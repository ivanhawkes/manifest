name: ci
# Every commit has passed ci.sh locally; CI shows only that a clean checkout builds the distribution,
# stages its bundle and runs it on Ubuntu (D-116, the user's).
on:
  # Promoting a verified feature-base SHA to main needs no second gate (D-053, scripts/promote.sh).
  push:
    branches: [feature-base]
  pull_request:
    branches: [feature-base]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v7
      # Before Nix and the build: the shell must be the pinned SDK's (D-006, D-054).
      - name: Environment parity
        shell: bash -euo pipefail {0}
        run: ./scripts/test-env-parity.sh && ./scripts/check-env-parity.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = 2
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
          skipPush: true
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.4.0
      # The log under build/, which is ignored: the bundle is staged from a clean checkout.
      - name: Build and stage the bundle (clang-release)
        shell: bash -euo pipefail {0}
        run: mkdir -p build && devenv shell -- ./scripts/stage-bundle.sh 2>&1 | tee build/ci.log
      # Outside the development shell, as an operator runs it.
      - name: Smoke test the bundle on the runner's Ubuntu
        shell: bash -euo pipefail {0}
        run: ./scripts/test-bundle.sh build/bundle/manifest-*.tar.gz host 2>&1 | tee -a build/ci.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-log
          path: build/ci.log
          if-no-files-found: ignore
