# The names of the generated universe's space stations: Old Norse personal, mythological and place
# names from the sagas, the Eddas and the Landnamabok, one word each and spelt in ASCII (th for thorn,
# d for eth, ae for ash, o for o-ogonek and o-slash, the accents dropped), the nominative -r kept. A
# station takes a name from here, unique among stations, as a system takes one from latin and a
# planet from greek (solar-system-names.yaml). Not loaded until stations are generated: data/build.sh
# writes only solar-system-names.yaml's pools, and the world generator deals from all of them. None
# of these is in the latin or greek pools.
