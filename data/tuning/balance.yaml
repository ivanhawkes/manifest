---
# The balance inputs of the first scenario: initial test values, selected in the plans and not
# yet validated (docs/decision-ledger.md, "Numeric values"). No rule reads them until Stages 3-4
# implement it; the content loader holds them to their ranges now. A value the design has not
# selected is left out.

economy:
  # Simulation seconds between regular payroll, household purchases and the condition update.
  intervalSeconds: 60
  # The share of wages actually paid that is withheld for the regional treasury.
  wageTaxRate: 0.1

# The household's essential needs, each by the people it feeds: a rate per 1,000 people per
# simulation day, in its unit, met by any of its items 1:1 in that unit. Weights combine the
# needs' shortages into one severity; physical quantity and price do not set importance.
needs:
  - needId: NeedStapleFood
    weight: 1
    perThousandPerDay: 0.5
    unit: Tonne
    items: [{itemId: ItemRice}, {itemId: ItemWheat}, {itemId: ItemOats}, {itemId: ItemBarley}]
  # 3,000 litres, in kilolitres, the unit water is billed in.
  - needId: NeedDrinkingWater
    weight: 1
    perThousandPerDay: 3
    unit: Kilolitre
    items: [{itemId: ItemDrinkingWater}]
  - needId: NeedBasicMedicalSupplies
    weight: 1
    perThousandPerDay: 5
    unit: Kilogram
    items: [{itemId: ItemBasicMedicalSupplies}]

# Health and happiness, 0 to 100, in points per simulation hour: a loss scaled by the severity
# of the shortage, a recovery only when every essential is met. Each condition's factor in the
# production work rate runs from workRateFloor at 0 to 1 at 100.
condition:
  initial: 100
  healthLossPerHour: 6
  happinessLossPerHour: 12
  healthRecoveryPerHour: 3
  happinessRecoveryPerHour: 6
  workRateFloor: 0.5

# A region's employer works each market row it makes in batches of whole totes, each about a day of the
# row's rate (the user's choice, W04), its gross wage bill a share of the output's value at its base
# price, reserved as the batch starts and paid as the work is done.
production:
  batchSeconds: 86400
  wageShare: 0.3

# A ship's onboard life support, while it relies on it.
lifeSupport:
  oxygenKilogramsPerOccupantDay: 1
  cartridgeOccupantDays: 30
  # What Refill and Replace take from a ship's hold (D-094).
  oxygenItemId: ItemOxygen
  cartridgeItemId: ItemCarbonScrubberCartridge

company:
  # A new player's trading company's account, in whole credits (D-077): about a full hold of grain
  # in the starter; totes of furs, salt, lime, glassware, soap or copper (D-087).
  startingCredits: 25000

market:
  # What a venue takes from each side of a fill, in basis points of its gross (D-083).
  listingFeeBps: 40
  # A resting order's life: one simulation day (D-085).
  orderLifeSeconds: 86400
  # A market report's sales volume is over the hour before it was observed, an initial balance setting
  # (docs/market-information-plan.md, "Sales reporting").
  salesWindowSeconds: 3600

# What each venue charges as the initial state opens it, in whole credits (D-097, D-098, D-100); each
# venue's operator's to change. A ship pays by its fee class, its hull's pad class: a docking fee as a
# journey to the venue starts, and as each simulation hour ends, for each ship docked there, a berth
# fee and a share for each occupant it keeps connected to the venue's life support. The class fees
# rise with pad area from the skiff's 80 m² (the user's, 2026-11-21).
charges:
  padClasses:
    - {padClass: skiff, dockingFee: 100, berthFeePerHour: 20}
    - {padClass: corvette, dockingFee: 1750, berthFeePerHour: 350}
    - {padClass: frigate, dockingFee: 5625, berthFeePerHour: 1125}
    - {padClass: destroyer, dockingFee: 18000, berthFeePerHour: 3600}
    - {padClass: cruiser, dockingFee: 54000, berthFeePerHour: 10800}
  berthFeePerOccupantHour: 2
  # Yearly interest on unpaid berth fees, in basis points, compounded daily on what is owed, and the
  # game's usury limit, the most any venue may set (the user's, 2026-11-21).
  arrearsRateBps: 1000
  maxArrearsRateBps: 3500
  # How a venue whose operator no player directs moves its fees, once a day, by its station's share of
  # pads taken, in basis points: 10% of the defaults up above 3/4 full and down below 1/4, within half
  # to twice the defaults (the user's, 2026-11-21).
  pricing:
    raiseAboveBps: 7500
    lowerBelowBps: 2500
    stepBps: 1000
    minLevelBps: 5000
    maxLevelBps: 20000

brokers:
  # Each venue's broker (D-084), initial test values (W03): its account at the start, in whole
  # credits, and its quotes 10% apart around the native price.
  treasury: 1000000
  spreadBps: 1000

concessions:
  # The frontier concession's exclusive term, in real server-running hours, not simulation time.
  termHours: 72

procurement:
  # The performance security a supplier locks at award, as a share of its winning total offer.
  performanceSecurityRate: 0.1

# The governance scenario's first technology: delivered project inputs, consumed once, unlock
# the recipe in one region. Work durations and the recipe's wage bill are open.
# Quantities are in each item's trading unit, tonnes for these metals.
projects:
  - projectId: ProjectBronzeMetallurgy
    requires: [{skillId: SkillSmelting}]
    inputs: [{itemId: ItemCopper, quantity: 0.09}, {itemId: ItemTin, quantity: 0.01}]
    unlocksRecipe: RecipeBronze

recipes:
  - recipeId: RecipeBronze
    inputs: [{itemId: ItemCopper, quantity: 0.009}, {itemId: ItemTin, quantity: 0.001}]
    outputs: [{itemId: ItemBronze, quantity: 0.01}]
