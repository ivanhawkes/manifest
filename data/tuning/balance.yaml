---
# The balance inputs of the first scenario: initial test values, selected in the plans and not
# yet validated (docs/decision-ledger.md, "Numeric values"). The rules read them, and the content
# loader holds them to their ranges. A value the design has not selected is left out.

economy:
  # Simulation seconds between regular payroll, household purchases and the condition update.
  intervalSeconds: 60
  # The share of the wages actually paid that is withheld for a region's treasury, in basis points
  # (D-098, D-120): every region's to start, and the bounds its governor sets it within. An AI
  # governor steers its own as each day ends, up a step while its treasury holds less than its
  # commitments, reservePerPerson credits for each of its people, down a step while it holds more
  # than surplusBps of them (L29's best guesses, 2026-11-28: the trading scenario's poorest regions,
  # 10 credits a head, raise theirs, its richest, over 100, lower theirs, and the rest hold).
  wageTax:
    initialBps: 1000
    minBps: 0
    maxBps: 5000
    stepBps: 100
    reservePerPerson: 20
    surplusBps: 50000

# The household's essential needs, each by the people it feeds: a rate per 1,000 people per
# simulation day, in its unit, met by any of its items 1:1 in that unit. Weights combine the
# needs' shortages into one severity; physical quantity and price do not set importance.
needs:
  - needId: NeedStapleFood
    weight: 1
    perThousandPerDay: 0.5
    unit: Tonne
    items:
      - {itemId: ItemRice}
      - {itemId: ItemWheat}
      - {itemId: ItemOats}
      - {itemId: ItemBarley}
      - {itemId: ItemBeans}
      - {itemId: ItemLentils}
      - {itemId: ItemChickpeas}
      - {itemId: ItemPeas}
  # 3,000 litres, in kilolitres, the unit water is billed in.
  - needId: NeedDrinkingWater
    weight: 1
    perThousandPerDay: 3
    unit: Kilolitre
    items: [{itemId: ItemDrinkingWater}]
  - needId: NeedBasicMedicalSupplies
    weight: 1
    perThousandPerDay: 5
    unit: Kilogram
    items: [{itemId: ItemBasicMedicalSupplies}]
  # 50 grams of salt to cook with and preserve, and a bar of soap a month, for hygiene (the user's,
  # 2026-11-21): salt's lack kills as food's does, soap's harms health more slowly.
  - needId: NeedSalt
    weight: 1
    perThousandPerDay: 0.05
    unit: Tonne
    items: [{itemId: ItemSalt}]
  - needId: NeedHygiene
    weight: 0.5
    perThousandPerDay: 30
    unit: Unit
    items: [{itemId: ItemSoap}]

# The goods no need names, bought only in an interval every need is met (D-102), by the bucket of
# their item's category: at up to premium over their native price, and demandShare of their authored
# demand (the user's, 2026-11-21). A category in no bucket is bought at its native price, all of its
# demand. Everyday goods sell at a premium; luxuries less often and nearer their price.
optionalGoods:
  - bucketId: BucketEveryday
    premium: 0.2
    demandShare: 1
    categories:
      - {categoryId: CategoryAppliances}
      - {categoryId: CategoryCommunications}
      - {categoryId: CategoryComputing}
      - {categoryId: CategoryConsumables}
      - {categoryId: CategoryCrafts}
      - {categoryId: CategoryElectronics}
      - {categoryId: CategoryEntertainment}
      - {categoryId: CategoryWellness}
  - bucketId: BucketLuxury
    premium: 0.05
    demandShare: 0.5
    categories:
      - {categoryId: CategoryAnimalProducts}
      - {categoryId: CategoryLuxuryGoods}
      - {categoryId: CategoryTextiles}

# Health and happiness, 0 to 100, in points per simulation hour: a loss scaled by the severity
# of the shortage, a recovery only when every essential is met. Each condition's factor in the
# production work rate runs from workRateFloor at 0 to 1 at 100.
condition:
  initial: 100
  healthLossPerHour: 6
  happinessLossPerHour: 12
  healthRecoveryPerHour: 3
  happinessRecoveryPerHour: 6
  workRateFloor: 0.5

# A region's employer works each market row it makes in batches of whole totes, each about a day of the
# row's rate (the user's choice, W04), its gross wage bill a share of the output's value at its base
# price, reserved as the batch starts and paid as the work is done. A maker's goods sell at about 0.5
# to 0.65 of their base price, so 0.45 leaves it a margin and pays its households enough to buy their
# needs and some optional goods (W19's balance, 2026-11-21); its wages per unit are also its floor.
production:
  batchSeconds: 86400
  wageShare: 0.45

# A ship's onboard life support, while it relies on it.
lifeSupport:
  oxygenKilogramsPerOccupantDay: 1
  cartridgeOccupantDays: 30
  # What Refill and Replace take from a ship's hold (D-094).
  oxygenItemId: ItemOxygen
  cartridgeItemId: ItemCarbonScrubberCartridge

# What every drive's fuel shares (D-108; docs/travel.md, "The fuel a leg burns"; each drive's own is
# in ships/drives.yaml): the tanks' own tonnes for each tonne of reaction mass they hold, and each
# occupant's kilograms, with their effects.
fuel:
  tankTonnesPerTonne: 0.25
  occupantKilograms: 100
  # The reaction mass a journey refuels its tanks with as it leaves a venue (W21).
  reactionMassItemId: ItemReactionMass
  # The thrusts a standing policy choosing its burn prices each trade at, in basis points, and the
  # seconds it allows each leg beside its cruise, for leaving and docking (W21).
  thrustSharesBps: [10000, 5000, 2500, 1000]
  legAllowanceSeconds: 1800

company:
  # A new player's trading company's account, in whole credits (D-077): about a full hold of grain
  # in the starter; totes of furs, salt, lime, glassware, soap or copper (D-087).
  startingCredits: 25000
  # What a company pays into a region's public account to found its homeworld there (D-110): a test
  # value, some eight starters' worth, so a player trades a while before founding.
  foundingPrice: 200000

# A polity's licence to buy pulse units at its venues (W22b): what an AI polity grants it for, in whole
# credits, paid to the treasuries of the regions it governs: two cargo-hold upgrades.
licence:
  feeCredits: 50000

market:
  # What a venue takes from each side of a fill, in basis points of its gross (D-083).
  listingFeeBps: 40
  # A resting order's life: one simulation day (D-085).
  orderLifeSeconds: 86400
  # A market report's sales volume is over the hour before it was observed, an initial balance setting
  # (docs/trading.md, "Market observations").
  salesWindowSeconds: 3600

# What each venue charges as the initial state opens it, in whole credits (D-097, D-098, D-100); each
# venue's operator's to change. A ship pays by its fee class, its hull's pad class: a docking fee as a
# journey to the venue starts, and as each simulation hour ends, for each ship docked there, a berth
# fee and a share for each occupant it keeps connected to the venue's life support. The class fees
# rise with pad area from the skiff's 80 m² (the user's, 2026-11-21), 1.25 credits a square metre to dock
# and a fifth of that an hour.
charges:
  padClasses:
    - {padClass: shuttle, dockingFee: 60, berthFeePerHour: 12}
    - {padClass: skiff, dockingFee: 100, berthFeePerHour: 20}
    - {padClass: cutter, dockingFee: 550, berthFeePerHour: 110}
    - {padClass: corvette, dockingFee: 1750, berthFeePerHour: 350}
    - {padClass: frigate, dockingFee: 5625, berthFeePerHour: 1125}
    - {padClass: destroyer, dockingFee: 18000, berthFeePerHour: 3600}
    - {padClass: cruiser, dockingFee: 54000, berthFeePerHour: 10800}
    - {padClass: battlecruiser, dockingFee: 77000, berthFeePerHour: 15400}
    - {padClass: battleship, dockingFee: 121500, berthFeePerHour: 24300}
    - {padClass: dreadnought, dockingFee: 216000, berthFeePerHour: 43200}
    - {padClass: titan, dockingFee: 495000, berthFeePerHour: 99000}
  berthFeePerOccupantHour: 2
  # Yearly interest on unpaid berth fees, in basis points, compounded daily on what is owed, and the
  # game's usury limit, the most any venue may set (the user's, 2026-11-21).
  arrearsRateBps: 1000
  maxArrearsRateBps: 3500
  # Whole days a ship's arrears may stand before its venue sells its cargo to pay them (the user's,
  # 2026-11-21).
  seizureGraceDays: 7
  # How a venue whose operator no player directs moves its fees, once a day, by its station's share of
  # pads taken, in basis points: 10% of the defaults up above 3/4 full and down below 1/4, within half
  # to twice the defaults (the user's, 2026-11-21).
  pricing:
    raiseAboveBps: 7500
    lowerBelowBps: 2500
    stepBps: 1000
    minLevelBps: 5000
    maxLevelBps: 20000

brokers:
  # Each venue's broker (D-084), initial test values (W03): its account at the start, in whole
  # credits, and its quotes 10% apart around the native price.
  treasury: 1000000
  spreadBps: 1000

concessions:
  # The frontier concession's exclusive term, in real server-running hours, not simulation time.
  termHours: 72

procurement:
  # The performance security a supplier locks at award, as a share of its winning total offer.
  performanceSecurityRate: 0.1
  # Whole simulation days (D-101): the bid and delivery windows an issuer may set, and an AI's.
  minBidDays: 1
  maxBidDays: 7
  minDeliveryDays: 1
  maxDeliveryDays: 60
  aiBidDays: 1
  aiDeliveryDays: 14
  # A region's tenders not yet closed, a tender's bids, and the closed tenders a region keeps.
  maxOpenTenders: 8
  maxBids: 32
  keptClosed: 16

# The governance scenario's first technology: delivered project inputs, consumed once, then its
# simulation days of work, unlock the recipe in one region (D-101). The recipe's wage bill is open.
# Counts are whole totes (D-087), the 9:1 of copper and tin kept.
projects:
  - projectId: ProjectBronzeMetallurgy
    requires: [{skillId: SkillSmelting}]
    inputs: [{itemId: ItemCopper, totes: 9}, {itemId: ItemTin, totes: 1}]
    workDays: 7
    # Its tenders' urgency, priced by need (D-102).
    priorityPremium: 0.5
    unlocksRecipe: RecipeBronze
  # A guild of smelters, which a region queues before Bronze where it lacks the skill (D-110): test
  # values.
  - projectId: ProjectSmeltersGuild
    inputs: [{itemId: ItemCopper, totes: 3}]
    workDays: 3
    priorityPremium: 0.5
    teachesSkill: SkillSmelting

recipes:
  - recipeId: RecipeBronze
    inputs: [{itemId: ItemCopper, totes: 9}, {itemId: ItemTin, totes: 1}]
    outputs: [{itemId: ItemBronze, totes: 10}]
