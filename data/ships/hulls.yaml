---
# The hulls a ship is built on (docs/companies.md, "Hulls"). Each is a hull as built, before any
# system is fitted:
#
#   baseStats          The stats it starts from, by EffectStat name; the ship systems it is fitted
#                      with and its operator's technology add to them. CargoVolume is the trade
#                      hold in totes, eight to the cubic metre IBC (D-087).
#   fitableEffects     The effects it has a slot for, by effect id: a system it has no slot for is
#                      refused.
#   occupants          The people it carries on a long journey; 0 for none, which a game mode
#                      with a cruise limit flies at its unmanned profile (D-090).
#   oxygenTanks        Its installed operating oxygen bank (D-050), each tank's capacity in
#                      kilograms. It is outside the trade hold, as the installed scrubber is.
#   scrubberCartridges The cartridges its installed scrubber holds.
#   pelletMagazine     The pellets its drive's magazine holds, in kilograms, outside the trade
#                      hold (D-108); its reaction mass tanks are its FuelCapacity, in tonnes.
#   driveId            The drive class it flies (ships/drives.yaml).
#   mass               What it weighs as it flies, in kilograms, which only its collisions feel:
#                      its thrusters are accelerations. A hull a scenario starts players in has one.
#
# A value the design has not selected is left out, not guessed: a stat it does not list is none,
# no fitableEffects is no upgrade, and occupants, oxygenTanks and scrubberCartridges left out are
# open (docs/history/stage-2-content-plan.md, "Item authoring"). The long-haul trader is the hull
# the ship systems of skill-tree/spaceship.yaml are bought against, its numbers chosen so that the
# three tiers of a system move it by a half to a third of what it starts at.
hull-base:

  - hull:
      hullId: HullTraderLongHaul
      className: Long-haul trader
      description: The cargo hauler the trade lanes run on
      baseStats:
        ShieldFront: 120
        ShieldSide: 80
        ShieldRear: 60
        GunFront: 24
        GunRear: 12
        LaserFront: 12
        LaserRear: 6
        DriveThrust: 420
        ManoeuvreJets: 48
        AttitudeControl: 10
        SensorLongRange: 4000
        SensorFireControl: 800
        SensorCommercial: 1500
        NavigationComputer: 2
        TraderComputer: 1.5
        CargoVolume: 7200
        FuelCapacity: 60
        SalvageCapacity: 15
        LifeSupportDays: 45
        StealthRating: 0.25
        EmissionsControl: 0.2
        Countermeasures: 0.15
        # Multipliers: a crew that has bought none of these does its base work.
        CrewTraining: 1
        DamageControl: 1
        SparesCapacity: 1
      fitableEffects: [
        ShieldFront, ShieldSide, ShieldRear, GunFront, GunRear, LaserFront, LaserRear,
        EngineThrust, ManoeuvringJets, AttitudeControl, SensorLongRange, SensorFireControl,
        SensorCommercial, ComputerNavigation, ComputerTrader, CargoHolds, FuelBunkers,
        SalvageRig, LifeSupport, StealthCoating, EmissionsControl, Countermeasures,
        CrewTraining, DamageControl, SparesLockers]
      driveId: DriveTorch

  # The lone trader's first ship (D-045, D-050): a 160-tote hold, one occupant, three
  # 10 kg oxygen tanks and one scrubber cartridge, provisioned once with every tank full and a fresh
  # cartridge; a loaded skiff's 20 t; 4 t of reaction mass tanks and a 12.5 kg pellet magazine, a
  # tote, provisioned full once (D-107, D-108); and slots for cargo holds, its company's first upgrade
  # (D-096), and fuel bunkers.
  - hull:
      hullId: HullLoneTraderStarter
      className: Lone-trader starter
      description: The entry ship of a lone trader
      baseStats:
        CargoVolume: 160
        FuelCapacity: 4
      fitableEffects: [CargoHolds, FuelBunkers]
      occupants: 1
      oxygenTanks: [10, 10, 10]
      scrubberCartridges: 1
      pelletMagazine: 12.5
      mass: 20000
      driveId: DriveTorch

  # The first larger hull (W22, D-108): a medium freighter of 2,500 t as it flies, on the hauler fusion
  # drive, its 4,000-tote hold 500 cubic metres, 400 t of reaction mass tanks and a 100 kg deuterium
  # magazine; four crew, four 50 kg oxygen tanks and two scrubber cartridges. Docks at a destroyer pad.
  # No command buys one yet (L48). Every number is a first guess for later balance.
  - hull:
      hullId: HullFreighterMedium
      className: Medium freighter
      description: A fusion hauler of thousands of tonnes, kept clear of stations
      baseStats:
        CargoVolume: 4000
        FuelCapacity: 400
      fitableEffects: [CargoHolds, FuelBunkers]
      occupants: 4
      oxygenTanks: [50, 50, 50, 50]
      scrubberCartridges: 2
      pelletMagazine: 100
      mass: 2500000
      driveId: DriveHaulerFusion

  # The compact single-occupant ship (D-044): 32 totes of cargo and a truck-cab cabin. Its
  # life support and its fittings against the 32-tote limit are open.
  - hull:
      hullId: HullCompactSingle
      className: Compact single-seat
      description: A one-occupant ship with a tiny long-journey cabin
      baseStats:
        CargoVolume: 32
      occupants: 1
      driveId: DriveTorch

  # The size classes as ship types (data/docks/pads), each a hull of its own on the smallest pad class
  # it fits. Only the name, the description, the drive and the hold are selected: the torch to a
  # frigate's size, the hauler fusion drive above it until the pulse drive (W22b); the hold, in totes, a
  # first guess at a share of the hull's envelope, a warship's 0.5% to 5%, a merchant's 2% to 25%.
  # Military types first, each on its own class's pad.
  - hull:
      hullId: HullShuttle
      className: Shuttle
      description: Short-range transport
      baseStats: {CargoVolume: 21}
      driveId: DriveTorch

  - hull:
      hullId: HullSkiff
      className: Skiff
      description: Small utility vessel
      baseStats: {CargoVolume: 39}
      driveId: DriveTorch

  - hull:
