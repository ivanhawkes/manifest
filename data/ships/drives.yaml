---
# The drive classes a hull names (D-108; docs/ships-plan.md, "Drives past the torch"):
#
#   exhaustKms                   Its exhaust speed in km/s, which sets the reaction mass a burn takes
#                                by the rocket equation to first order.
#   pelletItemId                 The pellets it burns, an item traded by the kilogram.
#   pelletMilligramsPerTonneKms  Pellets in milligrams for each tonne aboard and km/s of speed
#                                change, times the acceleration in g to curveExponent above 1 g.
#   exclusionRadius              Metres from a station within which it may not thrust, at least a
#                                station's reach (2,000 m).
#   cruise                       Its own manned and unmanned profiles in a mode with a cruise, in
#                                m/s² and seconds, in place of the mode's; left out, the mode's.
drive-base:

  # The torch (W21): a clean fusion drive, its exhaust 10% of light speed, burning fusion pellets of
  # deuterium and helium-3, and allowed to thrust from a station's reach.
  - drive:
      driveId: DriveTorch
      exhaustKms: 29979
      pelletItemId: ItemFusionPellets
      pelletMilligramsPerTonneKms: 16.5
      curveExponent: 2
      exclusionRadius: 2000

  # The hauler fusion drive of medium freighters, thousands of tonnes: deuterium fusion, its exhaust
  # 3% of light speed, 0.111 kg of reaction mass and 40 mg of deuterium a tonne-km/s, its neutrons
  # keeping it 1,000 km from every station. Manned or not, 0.6 g for at most 6 hours of a trip, 3
  # speeding up and 3 slowing down, and 0.3 g between.
  - drive:
      driveId: DriveHaulerFusion
      exhaustKms: 8994
      pelletItemId: ItemDeuteriumPellets
      pelletMilligramsPerTonneKms: 40
      curveExponent: 2
      exclusionRadius: 1.0e6
      cruise:
        manned: {boostAcceleration: 5.88399, boostSeconds: 21600, sustainedAcceleration: 2.941995}
        unmanned: {boostAcceleration: 5.88399, boostSeconds: 21600, sustainedAcceleration: 2.941995}
