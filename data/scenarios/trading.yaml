version: 1
# The eight-good trading fixture (docs/stage-2-content-plan.md, "Initial scenario"): one system,
# two planets, a region and a public station on each, with complementary markets, so a ship buys
# where a good is made and sells where it is wanted. Metals and furs come from Ore, salt, lime,
# glassware and soap from Brine. Every number is an initial test value recorded with C05, not a
# balance result. Positions are metres in the system's frame, a station 42,000 km out from its
# planet; market rates are per simulation day, in the item's unit (docs/model.md), and stock is in
# totes, eight to the IBC (D-087): the earlier quantities to the nearest tote, at least one.
gameMode: manifest
starterHull: HullLoneTraderStarter
items:
  - itemId: ItemCopper
  - itemId: ItemTin
  - itemId: ItemGold
  - itemId: ItemSalt
  - itemId: ItemLime
  - itemId: ItemFurs
  - itemId: ItemGlassware
  - itemId: ItemSoap

systems:
  - {systemId: SystemAnvil, displayName: Anvil}

planets:
  - {planetId: PlanetOre, systemId: SystemAnvil, displayName: Ore, position: [1.496e11, 0, 0]}
  - {planetId: PlanetBrine, systemId: SystemAnvil, displayName: Brine, position: [-2.279e11, 0, 0]}

civilisations:
  - {civilisationId: CivilisationOre, displayName: Ore, ageId: AgeClassical}
  - {civilisationId: CivilisationBrine, displayName: Brine, ageId: AgeClassical}

organisations:
  - {organisationId: OrganisationAnvilPortAuthority, kind: Polity, displayName: Anvil Port Authority}
  - {organisationId: OrganisationBrineCouncil, kind: Polity, displayName: Brine Council}

regions:
  # The player's home, ungoverned until it is allocated.
  - regionId: RegionOreHighlands
    planetId: PlanetOre
    civilisationId: CivilisationOre
    governorId: ""
    playerHome: true
    population: 25000
    householdFunds: 5000000
    publicFunds: 1000000
    health: 100
    happiness: 100
  - regionId: RegionBrineCoast
    planetId: PlanetBrine
    civilisationId: CivilisationBrine
    governorId: OrganisationBrineCouncil
    population: 25000
    householdFunds: 5000000
    publicFunds: 1000000
    health: 100
    happiness: 100

venues:
  - venueId: VenueOreHighport
    systemId: SystemAnvil
    planetId: PlanetOre
    position: [1.49642e11, 0, 0]
    operatorId: OrganisationAnvilPortAuthority
    public: true
    operational: true
    layout: highport
    lifeSupportCapacity: 4
    regions: [{regionId: RegionOreHighlands}]
    market:
      - {itemId: ItemCopper, production: 2, demand: 0, stock: 18}
      - {itemId: ItemTin, production: 0.3, demand: 0, stock: 3}
      - {itemId: ItemGold, production: 64.3, demand: 0, stock: 1}
      - {itemId: ItemFurs, production: 40, demand: 0, stock: 21}
      - {itemId: ItemSalt, production: 0, demand: 3.56, stock: 22}
      - {itemId: ItemLime, production: 0, demand: 5.18, stock: 12}
      - {itemId: ItemGlassware, production: 0, demand: 200, stock: 6}
      - {itemId: ItemSoap, production: 0, demand: 1500, stock: 2}
  - venueId: VenueBrineHighport
    systemId: SystemAnvil
    planetId: PlanetBrine
    position: [-2.27858e11, 0, 0]
    operatorId: OrganisationAnvilPortAuthority
    public: true
    operational: true
    layout: highport
    lifeSupportCapacity: 4
    regions: [{regionId: RegionBrineCoast}]
    market:
      - {itemId: ItemSalt, production: 4.75, demand: 0, stock: 176}
      - {itemId: ItemLime, production: 6.21, demand: 0, stock: 149}
      - {itemId: ItemGlassware, production: 250, demand: 0, stock: 50}
      - {itemId: ItemSoap, production: 2000, demand: 0, stock: 18}
      - {itemId: ItemCopper, production: 0, demand: 1.5, stock: 2}
      - {itemId: ItemTin, production: 0, demand: 0.25, stock: 1}
      - {itemId: ItemGold, production: 0, demand: 48.2, stock: 1}
      - {itemId: ItemFurs, production: 0, demand: 30, stock: 2}
