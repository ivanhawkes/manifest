version: 1
# The eight-good trading fixture (docs/stage-2-content-plan.md, "Initial scenario"): one system,
# two planets, a region and a public station on each, with complementary markets, so a ship buys
# where a good is made and sells where it is wanted. Metals and furs come from Ore, salt, lime,
# glassware, soap and the wellness goods from Brine. Every number is an initial test value recorded
# with C05, not a balance result. Where the bodies and stations are is the system's record
# (systems/system-anvil.yaml); market rates are per simulation day, in the item's unit
# (docs/model.md), and stock is in totes, eight to the IBC (D-087): about ten days of a row's rate,
# so a venue's broker's ladder takes a starter's run (W19's balance, 2026-11-21), and at least the
# earlier quantities. Each region trades the essentials at its venue (W04): Ore grows rice
# and lentils, a complete protein, and a little oats and beans, Brine wheat and chickpeas and a
# little barley and peas, each 13 t a day against its 12.5 (D-105), and Brine makes the medical
# supplies, the salt and the soap, which Ore must import, and each draws its own water; an
# essential's demand is its region's need, which sets its price. A row's region is the employer that
# makes it, and the households that want it when no need names it. Ore makes the oxygen and
# cartridges a ship's resupply takes, and Brine wants them (W09).
gameMode: manifest
starterHull: HullLoneTraderStarter
starterVenue: VenueOreHighport
items:
  - itemId: ItemCopper
  - itemId: ItemTin
  - itemId: ItemGold
  - itemId: ItemSalt
  - itemId: ItemLime
  - itemId: ItemFurs
  - itemId: ItemGlassware
  - itemId: ItemSoap
  - itemId: ItemWellnessProducts
  - itemId: ItemSupplements
  - itemId: ItemRice
  - itemId: ItemWheat
  - itemId: ItemOats
  - itemId: ItemBarley
  - itemId: ItemBeans
  - itemId: ItemLentils
  - itemId: ItemChickpeas
  - itemId: ItemPeas
  - itemId: ItemDrinkingWater
  - itemId: ItemBasicMedicalSupplies
  - itemId: ItemOxygen
  - itemId: ItemCarbonScrubberCartridge

systems:
  - {systemId: SystemAnvil, displayName: Anvil}

planets:
  - {planetId: PlanetOre, systemId: SystemAnvil, displayName: Ore}
  - {planetId: PlanetBrine, systemId: SystemAnvil, displayName: Brine}

civilisations:
  - {civilisationId: CivilisationOre, displayName: Ore, ageId: AgeClassical}
  - {civilisationId: CivilisationBrine, displayName: Brine, ageId: AgeClassical}

organisations:
  - {organisationId: OrganisationAnvilPortAuthority, kind: Polity, displayName: Anvil Port Authority}
  - {organisationId: OrganisationBrineCouncil, kind: Polity, displayName: Brine Council}

regions:
  # Ungoverned, for a player to found a homeworld in later (D-089).
  - regionId: RegionOreHighlands
    planetId: PlanetOre
    civilisationId: CivilisationOre
    governorId: ""
    population: 25000
    householdFunds: 5000000
    publicFunds: 1000000
    employerFunds: 1000000
    health: 100
    happiness: 100
  - regionId: RegionBrineCoast
    planetId: PlanetBrine
    civilisationId: CivilisationBrine
    governorId: OrganisationBrineCouncil
    population: 25000
    householdFunds: 5000000
    publicFunds: 1000000
    employerFunds: 1000000
    health: 100
    happiness: 100

