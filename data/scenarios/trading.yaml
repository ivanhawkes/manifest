version: 1
# The eight-good trading fixture (docs/stage-2-content-plan.md, "Initial scenario"): one system,
# two planets, a region and a public station on each, with complementary markets, so a ship buys
# where a good is made and sells where it is wanted. Metals and furs come from Ore, salt, lime,
# glassware and soap from Brine. Every number is an initial test value recorded with C05, not a
# balance result. Where the bodies and stations are is the system's record
# (systems/system-anvil.yaml); market rates are per simulation day, in the item's unit
# (docs/model.md), and stock is in totes, eight to the IBC (D-087): the earlier quantities to the
# nearest tote, at least one. Each region trades the essentials at its venue (W04): Ore grows rice and
# oats, Brine wheat and barley and makes the medical supplies, and each draws its own water; an
# essential's demand is its region's need, which sets its price. A row's region is the employer that
# makes it, and the households that want it when no need names it. Ore makes the oxygen and
# cartridges a ship's resupply takes, and Brine wants them (W09).
gameMode: manifest
starterHull: HullLoneTraderStarter
starterVenue: VenueOreHighport
items:
  - itemId: ItemCopper
  - itemId: ItemTin
  - itemId: ItemGold
  - itemId: ItemSalt
  - itemId: ItemLime
  - itemId: ItemFurs
  - itemId: ItemGlassware
  - itemId: ItemSoap
  - itemId: ItemRice
  - itemId: ItemWheat
  - itemId: ItemOats
  - itemId: ItemBarley
  - itemId: ItemDrinkingWater
  - itemId: ItemBasicMedicalSupplies
  - itemId: ItemOxygen
  - itemId: ItemCarbonScrubberCartridge

systems:
  - {systemId: SystemAnvil, displayName: Anvil}

planets:
  - {planetId: PlanetOre, systemId: SystemAnvil, displayName: Ore}
  - {planetId: PlanetBrine, systemId: SystemAnvil, displayName: Brine}

civilisations:
  - {civilisationId: CivilisationOre, displayName: Ore, ageId: AgeClassical}
  - {civilisationId: CivilisationBrine, displayName: Brine, ageId: AgeClassical}

organisations:
  - {organisationId: OrganisationAnvilPortAuthority, kind: Polity, displayName: Anvil Port Authority}
  - {organisationId: OrganisationBrineCouncil, kind: Polity, displayName: Brine Council}

regions:
  # Ungoverned, for a player to found a homeworld in later (D-089).
  - regionId: RegionOreHighlands
    planetId: PlanetOre
    civilisationId: CivilisationOre
    governorId: ""
    population: 25000
    householdFunds: 5000000
    publicFunds: 1000000
    employerFunds: 1000000
    health: 100
    happiness: 100
  - regionId: RegionBrineCoast
    planetId: PlanetBrine
    civilisationId: CivilisationBrine
    governorId: OrganisationBrineCouncil
    population: 25000
    householdFunds: 5000000
    publicFunds: 1000000
    employerFunds: 1000000
    health: 100
    happiness: 100

venues:
  - venueId: VenueOreHighport
    systemId: SystemAnvil
    planetId: PlanetOre
    operatorId: OrganisationAnvilPortAuthority
    public: true
    operational: true
    layout: highport
    lifeSupportCapacity: 4
    regions: [{regionId: RegionOreHighlands}]
    market:
      - {itemId: ItemCopper, regionId: RegionOreHighlands, production: 2, demand: 0, stock: 18}
      - {itemId: ItemTin, regionId: RegionOreHighlands, production: 0.3, demand: 0, stock: 3}
      - {itemId: ItemGold, regionId: RegionOreHighlands, production: 64.3, demand: 0, stock: 1}
      - {itemId: ItemFurs, regionId: RegionOreHighlands, production: 40, demand: 0, stock: 21}
      - {itemId: ItemSalt, regionId: RegionOreHighlands, production: 0, demand: 3.56, stock: 22}
      - {itemId: ItemLime, production: 0, demand: 5.18, stock: 12}
      - {itemId: ItemGlassware, regionId: RegionOreHighlands, production: 0, demand: 200, stock: 6}
      - {itemId: ItemSoap, regionId: RegionOreHighlands, production: 0, demand: 1500, stock: 2}
      - {itemId: ItemRice, regionId: RegionOreHighlands, production: 9, demand: 3.125, stock: 100}
      - {itemId: ItemOats, regionId: RegionOreHighlands, production: 6, demand: 3.125, stock: 80}
      - {itemId: ItemWheat, production: 0, demand: 3.125, stock: 10}
      - {itemId: ItemBarley, production: 0, demand: 3.125, stock: 10}
      - {itemId: ItemDrinkingWater, regionId: RegionOreHighlands, production: 80, demand: 75, stock: 1200}
      - {itemId: ItemBasicMedicalSupplies, production: 0, demand: 125, stock: 8}
      - {itemId: ItemOxygen, regionId: RegionOreHighlands, production: 228, demand: 0, stock: 16}
      - {itemId: ItemCarbonScrubberCartridge, regionId: RegionOreHighlands, production: 10, demand: 0,
         stock: 50}
  - venueId: VenueBrineHighport
    systemId: SystemAnvil
    planetId: PlanetBrine
    operatorId: OrganisationAnvilPortAuthority
    public: true
    operational: true
    layout: highport
    lifeSupportCapacity: 4
    regions: [{regionId: RegionBrineCoast}]
    market:
      - {itemId: ItemSalt, regionId: RegionBrineCoast, production: 4.75, demand: 0, stock: 176}
      - {itemId: ItemLime, regionId: RegionBrineCoast, production: 6.21, demand: 0, stock: 149}
      - {itemId: ItemGlassware, regionId: RegionBrineCoast, production: 250, demand: 0, stock: 50}
      - {itemId: ItemSoap, regionId: RegionBrineCoast, production: 2000, demand: 0, stock: 18}
      - {itemId: ItemCopper, production: 0, demand: 1.5, stock: 2}
      - {itemId: ItemTin, production: 0, demand: 0.25, stock: 1}
      - {itemId: ItemGold, production: 0, demand: 48.2, stock: 1}
      - {itemId: ItemFurs, regionId: RegionBrineCoast, production: 0, demand: 30, stock: 2}
      - {itemId: ItemWheat, regionId: RegionBrineCoast, production: 9, demand: 3.125, stock: 100}
      - {itemId: ItemBarley, regionId: RegionBrineCoast, production: 6, demand: 3.125, stock: 80}
      - {itemId: ItemRice, production: 0, demand: 3.125, stock: 10}
      - {itemId: ItemOats, production: 0, demand: 3.125, stock: 10}
      - {itemId: ItemDrinkingWater, regionId: RegionBrineCoast, production: 80, demand: 75, stock: 1200}
      - {itemId: ItemBasicMedicalSupplies, regionId: RegionBrineCoast, production: 250, demand: 125,
         stock: 16}
      - {itemId: ItemOxygen, production: 0, demand: 22.8, stock: 2}
      - {itemId: ItemCarbonScrubberCartridge, production: 0, demand: 1, stock: 4}
