# The trading fixture's system (data/scenarios/trading.yaml), a star system of Jettison's
# (Celestial.StarSystem): a Sun-like star, Ore an Earth-like planet and Brine a Mars-like one on
# their orbits, and a highport 42,000 km out from each. A body is named by its scenario ID, a
# station by its venue's, and the venue names its station layout. Ore is at +X and Brine at -X at
# simulation time 0. Metres, seconds and radians; a period left out is from the parent's
# gravitational parameter. Every number is an initial test value, not a balance result: a cruise
# between the planets takes a few minutes until long hauls are tuned.
version: 1
name: SystemAnvil
bodies:
  - name: StarAnvil
    kind: Star
    radius: 6.957e8
    gravitationalParameter: 1.32712440018e20
  - name: PlanetOre
    kind: Planet
    parent: StarAnvil
    radius: 6.371e6
    gravitationalParameter: 3.986004418e14
    orbit: {semiMajorAxis: 1.496e11, eccentricity: 0.0167}
    rotation: {period: 86164.0905, axialTilt: 0.4091}
  - name: VenueOreHighport
    kind: Station
    parent: PlanetOre
    radius: 763
    orbit: {semiMajorAxis: 4.2e7}
  - name: PlanetBrine
    kind: Planet
    parent: StarAnvil
    radius: 3.3895e6
    gravitationalParameter: 4.282837e13
    orbit: {semiMajorAxis: 2.279e11, eccentricity: 0.0934, meanAnomalyAtEpoch: 3.14159265}
    rotation: {period: 88642.66, axialTilt: 0.4396}
  - name: VenueBrineHighport
    kind: Station
    parent: PlanetBrine
    radius: 763
    orbit: {semiMajorAxis: 4.2e7}
