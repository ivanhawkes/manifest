---
# The fields and their units are defined in docs/model.md, "Units, prices and storage". Each
# price is the 2026-11-19 spot or contract quote where the good has a market, sourced in the
# same section, and the first-draft value converted to the unit where it has none.
#
# The food grains, the staples a household eats, are not the seeds in seeds.yaml: certified seed
# is priced as a technology product, the food grain as a bulk crop, both by the tonne. Wheat,
# barley and oats are the cleaned whole grain, with their seed's kernel and packing; rice is
# milled white rice, Thai 5% broken. density is the whole kernel, its pores included, and
# packFactor the test weight over it.
item-base:

  # Food grains
  - item:
      itemId: ItemWheat
      categoryId: CategoryConsumables
      ageId: AgeStone
      displayName: Wheat
      description: Cleaned whole wheat grain
      unitsPerCubicMetre: 1.27
      basePrice: 209
      unitType: Tonne
      density: 1.27
      packFactor: 0.61

  - item:
      itemId: ItemBarley
      categoryId: CategoryConsumables
      ageId: AgeStone
      displayName: Barley
      description: Cleaned whole barley grain
