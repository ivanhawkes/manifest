---
# The fields and their units are defined in docs/content.md, "Units and storage". Each price is the
# 2026-11-19 spot or contract quote where the good has a market, sourced in the same section, and
# the first-draft value converted to the unit where it has none.
#
# Charcoal and LPG, both traded by the tonne: LPG at Saudi Aramco's propane contract price, the
# Asian benchmark. A ship's torch burns reaction mass and fusion pellets, its own fuels (D-107,
# D-108), both traded by the kilogram, the unit of its tanks: reaction mass is purified water ice,
# 1,000 kg to the cubic metre packed at 0.9, 112.5 kg a tote; pellets are deuterium and helium-3,
# 100 kg to the cubic metre, 12.5 kg a tote. LPG stays the planets' cooking and vehicle fuel.
item-base:

  - item:
      itemId: ItemCharcoal
      categoryId: CategoryFuels
      ageId: AgeStone
      displayName: Charcoal
      description: Wood with all the moisture removed
      unitsPerCubicMetre: 0.455
      basePrice: 989
      unitType: Tonne
      density: 1.3
      packFactor: 0.35

  - item:
      itemId: ItemLPG
      categoryId: CategoryFuels
      ageId: AgeIndustrial
      displayName: LPG
      description: Liquefied petroleum gas, propane and butane under pressure
      unitsPerCubicMetre: 0.243
      basePrice: 720
      unitType: Tonne
      density: 0.54
      packFactor: 0.45

  - item:
      itemId: ItemReactionMass
      categoryId: CategoryFuels
      ageId: AgeSpace
      displayName: Reaction mass
      description: Purified water ice, the mass a ship's torch throws out behind it
      unitsPerCubicMetre: 900
      basePrice: 0.25
      unitType: Kilogram
      density: 1
      packFactor: 0.9

  - item:
      itemId: ItemFusionPellets
      categoryId: CategoryFuels
      ageId: AgeSpace
      displayName: Fusion pellets
      description: Deuterium and helium-3, the fuel a ship's torch burns
      unitsPerCubicMetre: 100
      basePrice: 1200
      unitType: Kilogram
      density: 0.2
      packFactor: 0.5

  # The hauler fusion drive's fuel (D-108): deuterium alone, separated from water wherever there is
  # any, so a twentieth of the torch's pellets' price; packed as they are.
  - item:
      itemId: ItemDeuteriumPellets
      categoryId: CategoryFuels
      ageId: AgeSpace
      displayName: Deuterium pellets
      description: Deuterium, the fuel a hauler's fusion drive burns
      unitsPerCubicMetre: 100
      basePrice: 60
      unitType: Kilogram
      density: 0.2
      packFactor: 0.5

  # The pulse drive's fuel (W22b): a pulse unit, a small bomb and its propellant, traded by the unit,
  # eight to the cubic metre, a tote each, so 100 kg a unit at its density and pack factor. Priced so
  # the pulse drive costs about the hauler's a tonne-km/s (docs/ships-plan.md, "Its price").
  - item:
      itemId: ItemPulseUnits
      categoryId: CategoryFuels
      ageId: AgeSpace
      displayName: Pulse units
      description: Shaped nuclear charges, the pulse drive's bombs and their propellant
      unitsPerCubicMetre: 8
