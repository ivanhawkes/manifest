---
# The fields and their units are defined in docs/content.md, "Units and storage". Each price is the
# 2026-11-19 spot or contract quote where the good has a market, sourced in the same section, and
# the first-draft value converted to the unit where it has none.
#
# Certified seed by the tonne. density is the whole seed, its pores included, and packFactor the
# test weight over it: wheat at 78 kg per hectolitre over 1.27 gives 0.61, the rest of the cube
# the air between kernels. Seed costs far more than the same grain as food: hybrid maize seed is a
# technology product, not a bulk crop. Cocoa is the exception, its beans the ICE commodity.
item-base:

  # Seeds
