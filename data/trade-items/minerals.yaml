# The fields and their units are defined in docs/model.md, "Units, prices and storage". Each
# price is the 2026-11-19 spot or contract quote where the good has a market, sourced in the
# same section, and the first-draft value converted to the unit where it has none.
#
# Bulk minerals by the tonne, heaped, bagged or drummed, so the packFactor carries the air between
# the grains, which is most of the volume for a light, floured material like lime. density is the
# solid mineral, not the heap. Natron is priced as Chinese dense soda ash, the nearest market.
