# The fields and their units are defined in docs/content.md, "Units and storage". Each price is the
# 2026-11-19 spot or contract quote where the good has a market, sourced in the same section, and
# the first-draft value converted to the unit where it has none.
#
# Water, flour, bread and the fermented drinks. Water is billed by the kilolitre, the cubic metre a
# utility meters; the drinks by the litre; flour by the tonne and bread by the kilogram, as each
# is sold wholesale.
item-base:

  # Bulk potable water, about a credit a tote (D-093): three quarters of a kilolitre to the packed
  # cube, as ItemBeer, so 0.09375 kL a tote at 10.67 a kilolitre.
