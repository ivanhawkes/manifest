---
# The fields and their units are defined in docs/model.md, "Units, prices and storage". Each
# price is the 2026-11-19 spot or contract quote where the good has a market, sourced in the
# same section, and the first-draft value converted to the unit where it has none.
#
# Water, flour, bread and the fermented drinks. Water is billed by the kilolitre, the cubic metre a
# utility meters; the drinks by the litre; flour by the tonne and bread by the kilogram, as each
# is sold wholesale.
item-base:

  # Bulk potable water at 2025 utility rates: one kilolitre to the cubic metre, three quarters of an
  # IBC cube filled, as ItemBeer.
  - item:
      itemId: ItemDrinkingWater
      categoryId: CategoryWater
      ageId: AgeStone
      displayName: Drinking Water
      description: Potable water, in bulk
      unitsPerCubicMetre: 1
      basePrice: 2
      unitType: Kilolitre
      density: 1.0
      packFactor: 0.75

