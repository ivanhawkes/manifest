  # Potassium travels as the molten metal, 60 C and above, pumped into insulated
  # steel tanks: a kilolitre is a cubic metre of the metal, density 0.862 is the
  # figure at 20 C, and the packFactor is the headspace the tank leaves for
  # expansion. Alkali metals carry a handling surcharge over the element price.
  - item:
      itemId: ItemPotassium
      categoryId: CategoryMetals
      ageId: AgeIndustrial
      displayName: Potassium
      description: Potassium ingots
      unitsPerCubicMetre: 862
      basePrice: 10.4
      unitType: Kilogram
      density: 0.862
      packFactor: 0.9

  # Uranium trades as U3O8 powder (yellowcake) in sealed drums, so the density is
  # the concentrate's 8.3 and the packFactor covers the drum, its liners and the
  # headspace, which leaves the 1.66 tonnes a cubic metre a drummed powder fills.
  # The price is the 2025 spot figure for the concentrate, not the far costlier metal.
  - item:
      itemId: ItemUranium
      categoryId: CategoryMetals
      ageId: AgePost-industrial
      displayName: Uranium
      description: Uranium, oxide concentrate in sealed drums
      unitsPerCubicMetre: 8300
