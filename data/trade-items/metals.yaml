---
# The fields and their units are defined in docs/model.md, "Units, prices and storage". Each
# price is the 2026-11-19 spot or contract quote where the good has a market, sourced in the
# same section, and the first-draft value converted to the unit where it has none.
#
# Metals are ingots, so density is the solid metal. The base metals and antimony are traded by
# the tonne at the LME and Rotterdam prices, the alloys at the LME value of the metal in them;
# the minor metals by the kilogram. packFactor is the stack: prime ingots stack well, section and
# scrap offcuts do not, and reactive metals travel in oil-filled drums that spend part of the cube
# on the drum and the oil.
item-base:

  # Metals
  - item:
      itemId: ItemCopper
      categoryId: CategoryMetals
      ageId: AgeCopper
      displayName: Copper
      description: Copper ingots
      unitsPerCubicMetre: 8.96
      basePrice: 13226
      unitType: Tonne
      density: 8.96
      packFactor: 0.85

