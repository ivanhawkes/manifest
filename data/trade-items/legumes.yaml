# The fields and their units are defined in docs/content.md, "Units and storage". Each price is the
# 2026-11-19 spot or contract quote where the good has a market, sourced in the same section, and
# the first-draft value converted to the unit where it has none.
#
# The legumes, staples a household eats as it eats the food grains (the user's, 2026-11-21): the
# dried, cleaned seed, by the tonne. density is the whole seed and packFactor its bulk density over
# it, as the grains'.
item-base:

  - item:
      itemId: ItemBeans
      categoryId: CategoryConsumables
      ageId: AgeStone
      displayName: Beans
      description: Dried beans
      unitsPerCubicMetre: 1.3
