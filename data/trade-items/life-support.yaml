---
# The fields and their units are defined in docs/content.md, "Units and storage". Each price is the
# 2026-11-19 spot or contract quote where the good has a market, sourced in the same section, and
# the first-draft value converted to the unit where it has none.
#
# The two consumables of a ship's life support. Oxygen is the refrigerated liquid, traded by the
# kilogram, the unit of a ship's tanks and its use, at the bulk liquid-oxygen price; it is packed
# as ItemNitrogen is. A cartridge is the replaceable lithium hydroxide charge of the installed
# scrubber, rated fresh at 30 occupant-days; the machinery stays aboard. Sixteen cartridges of
# 41 kg pack an IBC cube.
item-base:

  # Life support
  - item:
      itemId: ItemOxygen
      categoryId: CategoryLifeSupport
      ageId: AgeIndustrial
      displayName: Oxygen
      description: Breathing oxygen (refrigerated liquid)
      unitsPerCubicMetre: 1140
      basePrice: 0.26
      unitType: Kilogram
      density: 1.14
      packFactor: 0.9

  - item:
      itemId: ItemCarbonScrubberCartridge
      categoryId: CategoryLifeSupport
      ageId: AgeIndustrial
      displayName: Carbon scrubber cartridge
      description: A fresh standard scrubber cartridge, 30 occupant-days of carbon dioxide removal
      unitsPerCubicMetre: 16
      basePrice: 800
      unitType: Unit
      density: 1.46
      packFactor: 0.45
