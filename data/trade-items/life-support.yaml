---
# Field conventions for every item in this file (the full note is in the README,
# under "Units, prices and storage"):
#
#   density            Specific gravity against water at sea level, so 1.0 is
#                      1000 kg/m3, measured on the material the item is made of.
#   unitType           The unit that basePrice and unitsPerCubicMetre count.
#   unitsPerCubicMetre Units of loose product filling one cubic metre of solid
#                      material: density x 1000 for Kilogram, and the packed piece
#                      count of an IBC cube for Unit.
#   packFactor         The fraction of an IBC cube's cubic metre that the product
#                      fills, counting packaging, dunnage and interstitial voids.
#                      Mass per IBC cube = density x 1000 x packFactor kilograms.
#   basePrice          Market value per unitType, in credits at one credit to one
#                      US dollar, at 2025 prices.
#
# The two consumables of a ship's life support. Oxygen is traded by the kilolitre, as every
# fluid is, the refrigerated liquid in vacuum-jacketed tanks, packed as ItemNitrogen is; a ship's
# tanks and its use are kilograms, 1,140 to the kilolitre at its density. A
# cartridge is the replaceable lithium hydroxide charge of the installed scrubber,
# rated fresh at 30 occupant-days; the machinery stays aboard. Sixteen cartridges
# of 41 kg pack an IBC cube.
item-base:

  # Life support
  - item:
      itemId: ItemOxygen
      categoryId: CategoryLifeSupport
      ageId: AgeIndustrial
      displayName: Oxygen
      description: Breathing oxygen (refrigerated liquid)
      unitsPerCubicMetre: 1
      basePrice: 570
      unitType: Kilolitre
      density: 1.14
      packFactor: 0.9

  - item:
      itemId: ItemCarbonScrubberCartridge
      categoryId: CategoryLifeSupport
      ageId: AgeIndustrial
      displayName: Carbon scrubber cartridge
      description: A fresh standard scrubber cartridge, 30 occupant-days of carbon dioxide removal
      unitsPerCubicMetre: 16
      basePrice: 800
      unitType: Unit
      density: 1.46
      packFactor: 0.45
